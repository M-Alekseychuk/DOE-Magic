    <script>
      // In AI Studio proxy / preview environments, suppress Vite HMR WebSocket transport rejections per environment constraints
      window.addEventListener('unhandledrejection', (event) => {
        const msg = event?.reason?.message || (typeof event?.reason === 'string' ? event.reason : '');
        const stack = event?.reason?.stack || '';
        if (
          msg.includes('WebSocket') ||
          stack.includes('createWebSocketModuleRunnerTransport') ||
          stack.includes('@vite/client')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', (event) => {
        const msg = event?.message || '';
        const filename = event?.filename || '';
        if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
